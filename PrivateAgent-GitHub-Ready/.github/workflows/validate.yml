name: Validate PrivateAgent

on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -d apps/agent
          test -d apps/admin
          test -d firebase
          test -f README.md
          echo "Repository structure OK"

      - name: Check Firebase files
        run: |
          test -f firebase/firebase.json
          test -f firebase/database.rules.json
          test -f firebase/storage.rules
          echo "Firebase files OK"

      - name: Check Admin project
        run: |
          if [ -f apps/admin/pubspec.yaml ]; then
            echo "Flutter Admin project detected"
          else
            echo "Warning: apps/admin/pubspec.yaml not found"
          fi

      - name: Check Agent project
        run: |
          if [ -f apps/agent/gradlew ]; then
            echo "Android Agent Gradle project detected"
          else
            echo "Warning: apps/agent/gradlew not found"
          fi
