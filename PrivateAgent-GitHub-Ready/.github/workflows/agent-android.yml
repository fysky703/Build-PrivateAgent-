name: Agent Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/agent/**'
      - '.github/workflows/agent-android.yml'
  pull_request:
    paths:
      - 'apps/agent/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privateagent-agent-debug
          path: apps/agent/**/build/outputs/apk/**/*.apk
