name: Build PrivateAgent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Project
        run: |
          echo "=== Root files ==="
          find . -maxdepth 3 -type f | sort

          echo "=== Android project ==="
          ls -la agent-android || true

          echo "=== Gradle Wrapper ==="
          ls -la agent-android/gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: agent-android
        run: |
          echo "=== Java Version ==="
          java -version

          echo "=== Gradle Version ==="
          gradle --version

          echo "=== Project Structure ==="
          find . -maxdepth 3 -type f | sort

          echo "=== Building APK ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace --info --no-daemon
          else
            gradle clean assembleDebug --stacktrace --info --no-daemon
          fi

      - name: Find APK
        if: success()
        run: |
          echo "=== APK files ==="
          find agent-android -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-debug-apk
          path: |
            agent-android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error